<style>
  :root {
    --panel-max: 620px;
  }
  body {
    margin: 0;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    background: #1b1d21;
    color: #d7dae0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
    box-sizing: border-box;
  }

  h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  .sub { font-size: 12px; color: #8b929c; margin: 0 0 20px; }

  #panel-wrap {
    width: 100%;
    max-width: var(--panel-max);
    background: #24272c;
    border: 1px solid #33373d;
    border-radius: 8px;
    padding: 16px;
    box-sizing: border-box;
  }
  #panel-wrap svg { width: 100%; height: auto; display: block; }

  /* --- The single behavior that matters: LED lens visibility toggle --- */
  /* Applied to the colored-lens path of button_04's LED_01 only.        */
  .led-off { opacity: 0; }

  /* Make only the live button feel interactive; others stay inert.       */
  #obj_panel_01_button_04 { cursor: pointer; }
  #obj_panel_01_button_04.pressed { opacity: 0.82; }

  /* --- Minimal state readout for bring-up --- */
  #readout {
    width: 100%;
    max-width: var(--panel-max);
    margin-top: 16px;
    font-size: 12px;
    line-height: 1.7;
    background: #24272c;
    border: 1px solid #33373d;
    border-radius: 8px;
    padding: 12px 16px;
    box-sizing: border-box;
  }
  #readout .row { display: flex; justify-content: space-between; }
  #readout .k { color: #8b929c; }
  #readout .v { color: #e8c07d; }
</style>

  </div>

<script>
"use strict";
(function () {
  // --- Single source of truth for the IDs this harness touches. ---
  const LIVE_BUTTON_ID = "obj_panel_01_button_04";
  const LIVE_LED_LENS_ID = "led_04_01_lens";   // the .fil5 lens path inside LED_01

  const btn     = document.getElementById(LIVE_BUTTON_ID);
  const ledLens = document.getElementById(LIVE_LED_LENS_ID);

  const roBtn = document.getElementById("ro-btn");
  const roLed = document.getElementById("ro-led");
  const roEvt = document.getElementById("ro-evt");

  // --- LED control: one function owns lens visibility. -----------------
  // Toggling a class (not a style attribute) keeps DOM diffs clean and
  // gives the bridge a single, greppable seam to drive later.
  function setLed(on) {
    ledLens.classList.toggle("led-off", !on);
    roLed.textContent = on ? "on" : "off";
  }
  function toggleLed() {
    setLed(ledLens.classList.contains("led-off"));  // off -> on, on -> off
  }

  // --- Button input capture: pointerdown / pointerup only. -------------
  // pointer* covers mouse, touch, and pen with one code path — right call
  // for a Chromium-locked localhost target.
  btn.addEventListener("pointerdown", function (e) {
    btn.setPointerCapture(e.pointerId);   // keep the release even if pointer drifts off
    btn.classList.add("pressed");
    roBtn.textContent = "down";
    roEvt.textContent = "pointerdown @ " + Math.round(performance.now()) + "ms";
    // PoC behavior: press toggles the LED. Swap for bridge injection later.
    toggleLed();
  });

  btn.addEventListener("pointerup", function (e) {
    btn.classList.remove("pressed");
    roBtn.textContent = "up";
    roEvt.textContent = "pointerup @ " + Math.round(performance.now()) + "ms";
  });

  // Safety net: if the pointer is cancelled (context menu, gesture),
  // don't leave the button stuck in the pressed visual state.
  btn.addEventListener("pointercancel", function () {
    btn.classList.remove("pressed");
    roBtn.textContent = "up";
    roEvt.textContent = "pointercancel";
  });

  // --- Boot state: LED starts off (lens hidden). -----------------------
  setLed(false);
})();
</script>
