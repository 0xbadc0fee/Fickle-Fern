  <div id="readout">
    <div class="row"><span class="k">bridge</span><span class="v" id="ro-conn">connecting…</span></div>
    <div class="row"><span class="k">button04_state (input)</span><span class="v" id="ro-btn">0 (up)</span></div>
    <div class="row"><span class="k">button04_lights (output)</span><span class="v" id="ro-led">00000000</span></div>
    <div class="row"><span class="k">last event</span><span class="v" id="ro-evt">—</span></div>
  </div>

<script>
"use strict";
(function () {
  // --- Signal-keyed lookup: replaces hardcoded element-ID constants. --------
  // Every scriptable element is found by its promoted data-signal attribute,
  // which is the friendly-name tag from fixture.def (VAR_ASSIGN arg 1). This is
  // the single naming seam shared by the .def table, the DLL accessors, the
  // bridge signal_map, and the WebSocket wire format. Do not reach for raw
  // Corel ids here.
  const SIG = {
    B4_STATE:  "button04_state",   // SVG2CNTRL input  (press target)
    B4_LIGHTS: "button04_lights",  // CNTRL2SVG output (light byte readout)
  };
  const BRIDGE_URL = "ws://127.0.0.1:8765";  // must match bridge.py host/port

  const bySignal = (name) => document.querySelector('[data-signal="' + name + '"]');

  const btn      = bySignal(SIG.B4_STATE);
  const lightsEl = bySignal(SIG.B4_LIGHTS);          // the <g id="txt_button04"> group
  const lightsText = lightsEl ? lightsEl.querySelector("text") : null;

  const roConn = document.getElementById("ro-conn");
  const roBtn  = document.getElementById("ro-btn");
  const roLed  = document.getElementById("ro-led");
  const roEvt  = document.getElementById("ro-evt");

  // Fail loud if the normalized SVG is missing an expected signal, rather than
  // silently no-op'ing the whole harness.
  if (!btn)        console.error('harness: no element with data-signal="' + SIG.B4_STATE + '"');
  if (!lightsText) console.error('harness: no <text> under data-signal="' + SIG.B4_LIGHTS + '"');

  // --- OUTPUT path: render an 8-bit light byte into the SVG text field. ------
  // Driven ONLY by inbound "state" frames from the bridge (the DLL's real
  // gt_svg.u8_svgKeypad01_b04_lights). The input path never touches this now —
  // input and output are fully decoupled across the bridge round-trip. The raw
  // byte packs 4 colors x 2 bits, read left-to-right as [BLUE][GREEN][AMBER][RED]
  // (00 off / 01 on / 10 flash); decoding is left to the side legend, per design.
  function fmtBin8(v) { return (v & 0xFF).toString(2).padStart(8, "0"); }

  function applyLights(value) {
    const s = fmtBin8(value);
    if (lightsText) lightsText.textContent = s;
    if (roLed) roLed.textContent = s;
  }

  // --- WebSocket transport ---------------------------------------------------
  // One socket to the localhost bridge. Inbound "state" frames drive the output
  // path; a "set" frame is sent on each press/release. Auto-reconnect keeps a
  // remote tester's page alive across a bridge restart without a manual refresh.
  let ws = null;
  let wsReady = false;
  let reconnectTimer = null;

  function setConn(text) { if (roConn) roConn.textContent = text; }

  function sendState(state) {
    // The bridge accepts any nonzero as pressed; we send a clean 0/1.
    if (!wsReady) return false;
    ws.send(JSON.stringify({ type: "set", signal: SIG.B4_STATE, value: state ? 1 : 0 }));
    return true;
  }

  function handleFrame(raw) {
    let msg;
    try { msg = JSON.parse(raw); } catch (_) { return; }
    if (msg.type === "state" && msg.signals && SIG.B4_LIGHTS in msg.signals) {
      applyLights(msg.signals[SIG.B4_LIGHTS]);   // the one output seam
    } else if (msg.type === "error") {
      roEvt.textContent = "bridge error: " + msg.message;
    }
  }

  function connect() {
    setConn("connecting…");
    ws = new WebSocket(BRIDGE_URL);

    ws.onopen = function () {
      wsReady = true;
      setConn("connected " + BRIDGE_URL);
      // The bridge sends an initial "state" snapshot on connect, so the light
      // field paints correct startup state without us asking.
    };
    ws.onmessage = function (e) { handleFrame(e.data); };
    ws.onerror = function () { setConn("error — is bridge.py running?"); };
    ws.onclose = function () {
      wsReady = false;
      setConn("disconnected — retrying…");
      // Fixed-interval retry; harmless if the bridge never comes back.
      if (!reconnectTimer) {
        reconnectTimer = setTimeout(function () {
          reconnectTimer = null;
          connect();
        }, 1000);
      }
    };
  }

  // --- INPUT path: pointerdown / pointerup, send b4 state 0/1. ---------------
  // pointer* covers mouse, touch, and pen in one code path — right for a
  // Chromium-locked localhost target. The handler ONLY sends the state; the
  // resulting light change comes back over the socket as a "state" frame. No
  // local echo — what you see is always the DLL's real output.
  function onEdge(state, label) {
    if (roBtn) roBtn.textContent = state + (state ? " (down)" : " (up)");
    const sent = sendState(state);
    roEvt.textContent = label + (sent ? "" : " (dropped — bridge offline)") +
                        " @ " + Math.round(performance.now()) + "ms";
  }

  btn && btn.addEventListener("pointerdown", function (e) {
    btn.setPointerCapture(e.pointerId);      // keep the release even if the pointer drifts off
    btn.classList.add("pressed");
    onEdge(1, "pointerdown");
  });

  btn && btn.addEventListener("pointerup", function () {
    btn.classList.remove("pressed");
    onEdge(0, "pointerup");
  });

  // Safety net: a cancelled pointer (context menu, gesture) must not leave the
  // button stuck pressed — and must still send the release so the DLL doesn't
  // hold a stale pressed state.
  btn && btn.addEventListener("pointercancel", function () {
    btn.classList.remove("pressed");
    onEdge(0, "pointercancel");
  });

  // --- Boot: show 0 until the bridge's first snapshot arrives, then connect. -
  applyLights(0);
  connect();
})();
</script>
